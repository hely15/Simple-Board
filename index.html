<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer type="module"></script>
</head>
<body>
    <dialog id="dialog__login">
        Hola soy la ventana
        <div class="dialog__header"> 
            <span id="dialog__login-close">X</span>
        </div>
        <div class="dialog__main">

        </div>
        <div class="dialog__footer"></div>
    </dialog>  
    <form action="?" id="form__login" method="get">
        <div class="div__title">
            <h1>CRUD OPERATIONS</h1>
            <strong>SIGN IN</strong>
            <p>Enter your credentials to acces your account</p>
        </div>
        <div class="div__input">
            <div>
                <label>Email</label>
                <input type="email" name="email" id="" required placeholder="Enter your Email">
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" id="" required placeholder="Enter your Password">
            </div>
        </div>
        <div class="div__button">
            <input type="submit" value="SIGN IN">
            <span>Forgot your password? <a href="#">Reset Password</a></span>
        </div>
    </form>
</body>
</html>
